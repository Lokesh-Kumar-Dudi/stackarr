services:
  # ── VPN Gateway (all traffic routed through Surfshark) ─────────
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${VPN_WIREGUARD_KEY}
      - WIREGUARD_ADDRESSES=${VPN_WIREGUARD_ADDRESSES}
      - DOT=off
      - BLOCK_MALICIOUS=off
      - BLOCK_SURVEILLANCE=off
      - BLOCK_ADS=off
      - DNS_PLAINTEXT_ADDRESS=1.1.1.1
    ports:
      # qBittorrent
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
      # Prowlarr
      - "9696:9696"
      # FlareSolverr
      - "8191:8191"
    volumes:
      - ${MEDIA_PATH}/config/gluetun:/gluetun
    restart: unless-stopped

  # ── Download Client (via VPN) ──────────────────────────────────
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=America/New_York
      - WEBUI_PORT=8080
    volumes:
      - ${MEDIA_PATH}/config/qbittorrent:/config
      - ${MEDIA_PATH}/downloads:/downloads
    restart: unless-stopped

  # ── Indexer Manager (via VPN) ──────────────────────────────────
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=America/New_York
    volumes:
      - ${MEDIA_PATH}/config/prowlarr:/config
    restart: unless-stopped

  # ── Cloudflare Bypass (via VPN) ────────────────────────────────
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - LOG_LEVEL=info
      - TZ=America/New_York
    restart: unless-stopped

  # ── TV Shows ───────────────────────────────────────────────────
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=America/New_York
    volumes:
      - ${MEDIA_PATH}/config/sonarr:/config
      - ${MEDIA_PATH}/tv:/tv
      - ${MEDIA_PATH}/downloads:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped

  # ── Movies ─────────────────────────────────────────────────────
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=America/New_York
    volumes:
      - ${MEDIA_PATH}/config/radarr:/config
      - ${MEDIA_PATH}/movies:/movies
      - ${MEDIA_PATH}/downloads:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped

  # ── Dashboard ──────────────────────────────────────────────────
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    environment:
      - TZ=America/New_York
      - SECRET_ENCRYPTION_KEY=821955e611073dfb9200cf715dcb0f89b137de61010e1f00b4ae43e0b5f0cf73
    volumes:
      - ${MEDIA_PATH}/config/homarr:/appdata
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "7575:7575"
    restart: unless-stopped

  # ── Media Streaming Server ─────────────────────────────────────
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=America/New_York
    volumes:
      - ${MEDIA_PATH}/config/jellyfin:/config
      - ${MEDIA_PATH}/movies:/data/movies
      - ${MEDIA_PATH}/tv:/data/tv
    ports:
      - "8096:8096"
    restart: unless-stopped

  # ── Request Management ─────────────────────────────────────────
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=info
      - TZ=America/New_York
    volumes:
      - ${MEDIA_PATH}/config/seerr:/app/config
    ports:
      - "5055:5055"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  # ── Container Management ───────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${MEDIA_PATH}/config/portainer:/data
    ports:
      - "9443:9443"
    restart: unless-stopped

  # ── Network Performance Tracking ───────────────────────────────
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=America/New_York
      - APP_KEY=${SPEEDTEST_APP_KEY}
      - APP_URL=${SPEEDTEST_APP_URL}
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE=0 * * * *
    volumes:
      - ${MEDIA_PATH}/config/speedtest-tracker:/config
    ports:
      - "8081:80"
    restart: unless-stopped
