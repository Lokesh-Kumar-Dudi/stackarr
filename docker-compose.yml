services:
  # ── VPN Gateway (all traffic routed through ProtonVPN) ─────────
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${VPN_WIREGUARD_KEY}
      - SERVER_COUNTRIES=${VPN_COUNTRY}
      - DOT=off
      - BLOCK_MALICIOUS=off
      - BLOCK_SURVEILLANCE=off
      - BLOCK_ADS=off
      - DNS_PLAINTEXT_ADDRESS=1.1.1.1
    ports:
      # qBittorrent
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
      # Prowlarr
      - "9696:9696"
    volumes:
      - ${MEDIA_PATH}/config/gluetun:/gluetun
    restart: unless-stopped

  # ── Download Client (via VPN) ──────────────────────────────────
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=America/New_York
      - WEBUI_PORT=8080
    volumes:
      - ${MEDIA_PATH}/config/qbittorrent:/config
      - ${MEDIA_PATH}/downloads:/downloads
    restart: unless-stopped

  # ── Indexer Manager (via VPN) ──────────────────────────────────
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=America/New_York
    volumes:
      - ${MEDIA_PATH}/config/prowlarr:/config
    restart: unless-stopped

  # ── TV Shows ───────────────────────────────────────────────────
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=America/New_York
    volumes:
      - ${MEDIA_PATH}/config/sonarr:/config
      - ${MEDIA_PATH}/tv:/tv
      - ${MEDIA_PATH}/downloads:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped

  # ── Movies ─────────────────────────────────────────────────────
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=America/New_York
    volumes:
      - ${MEDIA_PATH}/config/radarr:/config
      - ${MEDIA_PATH}/movies:/movies
      - ${MEDIA_PATH}/downloads:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped

  # ── Dashboard ──────────────────────────────────────────────────
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    environment:
      - TZ=America/New_York
      - SECRET_ENCRYPTION_KEY=821955e611073dfb9200cf715dcb0f89b137de61010e1f00b4ae43e0b5f0cf73
    volumes:
      - ${MEDIA_PATH}/config/homarr:/appdata
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "7575:7575"
    restart: unless-stopped

  # ── Media Streaming Server ─────────────────────────────────────
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=America/New_York
    volumes:
      - ${MEDIA_PATH}/config/jellyfin:/config
      - ${MEDIA_PATH}/movies:/data/movies
      - ${MEDIA_PATH}/tv:/data/tv
    ports:
      - "8096:8096"
    restart: unless-stopped
