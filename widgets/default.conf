server {
    listen 80;

    # Use Docker's embedded DNS so nginx re-resolves on every request
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # ── VPN widget API ──────────────────────────────────────────
    location /api/publicip {
        set $gluetun_upstream http://gluetun:8001;
        proxy_pass $gluetun_upstream/v1/publicip/ip;
    }

    # ── Add more widget API proxies below ───────────────────────
    # location /api/example {
    #     set $example_upstream http://some-service:1234;
    #     proxy_pass $example_upstream/some/path;
    # }
}
